services:
  app:
    build: .
    container_name: moonshinewiki
    restart: unless-stopped
    ports:
      # Наружу пробрасывается порт из APP_PORT (в .env или через install.sh).
      - "${APP_PORT:-3000}:3000"
    environment:
      # Внутренний порт контейнера фиксирован (3000).
      PORT: "3000"
      SESSION_SECRET: "${SESSION_SECRET:-change-me-to-a-long-random-string}"
      # Применяются только при первом запуске (когда база пуста).
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
      DB_PATH: "/app/data/moonshine.db"
    volumes:
      # SQLite-база и сессии сохраняются между перезапусками контейнера.
      - wiki-data:/app/data
      # Файл выгрузки данных из репозитория доступен контейнеру для автоимпорта.
      - ./data/export:/app/data/export:ro

volumes:
  wiki-data:
