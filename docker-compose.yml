services:
  app:
    build: .
    container_name: moonshinewiki
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      # Обязательно смените на случайный секрет в проде.
      SESSION_SECRET: "change-me-to-a-long-random-string"
      # Задаются только при первом запуске (когда база пуста).
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "admin123"
      DB_PATH: "/app/data/moonshine.db"
    volumes:
      # SQLite-база и сессии сохраняются между перезапусками контейнера.
      - wiki-data:/app/data
      # Файл выгрузки данных из репозитория доступен контейнеру для автоимпорта.
      - ./data/export:/app/data/export:ro

volumes:
  wiki-data:
