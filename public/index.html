<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fa" />
  <meta name="description" content="MoonshineWiki — база знаний о домашнем самогоноварении, виноделии и пивоварении" />
  <title>MoonshineWiki</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("wiki-theme") || "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/" data-link>
      <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" fill="currentColor" />
      </svg>
      <span>MoonshineWiki</span>
    </a>
    <div class="header-actions" id="header-actions"></div>
  </header>

  <nav class="main-nav" id="main-nav" aria-label="Основная навигация"></nav>

  <main id="app" class="app-main" aria-live="polite"></main>

  <div id="toast" class="toast" role="status"></div>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
